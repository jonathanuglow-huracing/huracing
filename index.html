<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Henry Uglow Racing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;1,900&display=swap" rel="stylesheet">
    
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Montserrat', sans-serif;
            background-color: #111;
            overflow: hidden;
        }

        /* Hero Background with Premium Gradient Overlay */
        .splash-container {
            position: relative;
            width: 100%;
            height: 100vh;
            /* Keeps text readable while maximizing background image brightness */
            background: linear-gradient(90deg, rgba(0, 0, 0, 0.65) 0%, rgba(0, 0, 0, 0.3) 50%, rgba(0, 0, 0, 0.1) 100%), 
                        url('splash-HU.jpg') center/cover no-repeat;
            
            /* Forces modern browsers to prioritize image crispness/sharpness */
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            
            display: flex;
            align-items: center;
            padding-left: 8%; 
        }

        /* Branding Text Layout */
        .brand-content {
            max-width: 600px;
            color: #ffffff;
            z-index: 2;
        }

        .subtitle {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 6px;
            color: #ff5722; /* Racing orange accent color */
            margin-bottom: 10px;
            font-weight: 700;
        }

        .main-title {
            font-size: 3.5rem;
            font-weight: 900;
            font-style: italic;
            text-transform: uppercase;
            line-height: 1.1;
            letter-spacing: 2px;
            margin-bottom: 30px;
            text-shadow: 2px 4px 10px rgba(0, 0, 0, 0.5);
        }

        /* Modernized Call to Action Button */
        .cta-button {
            display: inline-block;
            text-decoration: none;
            color: #ffffff;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            border: 2px solid #ffffff;
            padding: 16px 36px;
            border-radius: 4px;
            transition: all 0.3s ease-in-out;
            background: transparent;
        }

        /* Smooth Hover Effects */
        .cta-button:hover {
            background-color: #ffffff;
            color: #111111;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
        }

        .cta-button:active {
            transform: translateY(0);
        }

        /* Responsive Design for Mobile Screens */
        @media (max-width: 768px) {
            .splash-container {
                padding-left: 0;
                justify-content: center;
                text-align: center;
                background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), 
                            url('splash-HU.jpg') center/cover no-repeat;
            }

            .main-title {
                font-size: 2.5rem;
            }
            
            .subtitle {
                font-size: 0.8rem;
                letter-spacing: 4px;
            }
        }
    </style>
</head>
<body>

    <main class="splash-container" role="img" aria-label="Henry Uglow Racing Splash Background">
        <div class="brand-content">
            <p class="subtitle">Official Website</p>
            <h1 class="main-title">Henry Uglow<br>Racing</h1>
            <a href="home.html" class="cta-button">Enter Site</a>
        </div>
    </main>

</body>
</html>
