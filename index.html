<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HENRY UGLOW RACING</title>
    <style>
        /* Modern reset and dark background while image loads */
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            overflow: hidden; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0a0a0a;
        }

        .splash-container {
            height: 100vh;
            display: flex;
            flex-direction: column; /* Allows stacking title and button vertically */
            justify-content: center;
            align-items: center;
            /* Swap 'your-image-filename.jpg' with your actual image path */
            background: linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.5)), url('splash-bg.jpg') no-repeat center center fixed;
            background-size: cover;
        }

        h1 {
            color: #ffffff;
            font-size: 3rem;
            letter-spacing: 4px;
            margin-bottom: 2rem;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7);
            font-weight: 800;
            text-align: center;
        }

        .enter-btn {
            padding: 14px 36px;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 1px;
            background: #ffffff;
            border: 2px solid #ffffff;
            cursor: pointer;
            text-decoration: none;
            color: #000000;
            border-radius: 4px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        /* Smooth hover effect */
        .enter-btn:hover {
            background: transparent;
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.6);
        }
    </style>
</head>
<body>
    <div class="splash-container">
        <h1>HENRY UGLOW RACING</h1>
        <a href="home.html" class="enter-btn">ENTER SITE</a>
    </div>
</body>
</html>
