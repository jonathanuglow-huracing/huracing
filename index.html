<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Henry Uglow Racing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;1,900&display=swap" rel="stylesheet">
    
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Montserrat', sans-serif;
            background-color: #111;
            overflow: hidden;
        }

        /* Hero Background with Enhanced Brightness & Sharpness */
    .splash-container {
        position: relative;
        width: 100%;
        height: 100vh;
    
       /* 1. BRIGHTER: Lightened the black overlays from 0.75/0.4/0.2 down to 0.45/0.2/0.0 */
        background: linear-gradient(90deg, rgba(0, 0, 0, 0.45) 0%, rgba(0, 0, 0, 0.2) 50%, rgba(0, 0, 0, 0) 100%), 
                url('splash-HU.jpg') center/cover no-repeat;
    
        /* 2. SHARPER: Using CSS backdrop filters to force browser-side crispness rendering */
        image-rendering: -webkit-optimize-contrast;
        image-rendering: crisp-edges;
    
        display: flex;
        align-items: center;
        padding-left: 8%; 
        }

    /* Responsive Design for Mobile Screens */
    @media (max-width: 768px) {
        .splash-container {
            padding-left: 0;
            justify-content: center;
            text-align: center;
        
           /* 1. BRIGHTER (Mobile): Reduced dark overlay opacity from 0.6 down to 0.35 */
            background: linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.35)), 
                    url('splash-HU.jpg') center/cover no-repeat;
    }

    .main-title {
        font-size: 2.5rem;
    }
    
    .subtitle {
        font-size: 0.8rem;
        letter-spacing: 4px;
    }
}
            
    </style>
</head>
<body>

    <main class="splash-container">
        <div class="brand-content">
            <p class="subtitle">Official Website</p>
            <h1 class="main-title">Henry Uglow<br>Racing</h1>
            <a href="home.html" class="cta-button">Enter Site</a>
        </div>
    </main>

</body>
</html>
